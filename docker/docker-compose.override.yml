services:
  camera_pipeline:
      volumes:
        - ../launch:/ros2_ws/src/camera_pipeline/launch
        - ../camera_pipeline:/ros2_ws/src/camera_pipeline/camera_pipeline
        - ../resource:/ros2_ws/src/camera_pipeline/resource
        - ../test:/ros2_ws/src/camera_pipeline/test
        - ../LICENSE:/ros2_ws/src/camera_pipeline/LICENSE
        - ../package.xml:/ros2_ws/src/camera_pipeline/package.xml
        - ../setup.cfg:/ros2_ws/src/camera_pipeline/setup.cfg
        - ../setup.py:/ros2_ws/src/camera_pipeline/setup.py
      command: >
        bash -c "source /opt/ros/humble/setup.bash && colcon build --packages-select camera_pipeline && source install/setup.bash && ros2 launch camera_pipeline camera_pipeline.launch.py"